---
# ============================================================
# SECRETS — BAD EXAMPLES (Day 2.3 Anti-Patterns)
# ============================================================
# DO NOT RUN THIS PLAYBOOK — it is annotated for study only.
# Each task shows a common mistake + the PCI-DSS violation.
#
# Study method:
#   1. Read each task — identify the problem
#   2. Check tch_prep_claude0.md section 2.3 for the fix
#   3. Compare with secrets-good.yml for the corrected version
# ============================================================
# These tasks are wrapped in 'when: false' so they NEVER execute.
# The bad patterns are for code-review study, not execution.

- name: "BAD EXAMPLES — Ansible secrets anti-patterns (STUDY ONLY)"
  hosts: payment_servers
  become: true

  tasks:

    # ── Anti-Pattern 1: Hardcoded password in playbook ────────────────────
    # BUG: 'password: "SuperSecret123!"' is stored in git history forever.
    # Even after a commit that removes it, `git log -p` shows it permanently.
    # PCI-DSS violation: Req 8.2.2 (shared/hardcoded creds not allowed in CDE).
    # Fix: use ansible-vault encrypted variable: password: "{{ vault_db_password }}"
    - name: "BAD | Create payment DB user with hardcoded password"
      # NEVER RUNS — study only
      when: false
      postgresql_user:
        name: payments_app
        # BUG: hardcoded, in git history forever
        password: "SuperSecret123!"
        db: payments

    # ── Anti-Pattern 2: Running as root ───────────────────────────────────
    # BUG: become_user: root gives every task full system privileges.
    # If one task is exploited, the attacker has root on all payment servers.
    # PCI-DSS 8.2.1: use individual named accounts (not root).
    # Fix: become_user: deploy (non-root service account with specific sudo rules).
    - name: "BAD | Deploy app as root"
      when: false
      copy:
        src: app.jar
        dest: /opt/app/app.jar
      # BUG: entire deployment runs as root
      become_user: root

    # ── Anti-Pattern 3: Missing no_log on sensitive task ─────────────────
    # BUG: vault_token value appears in:
    #   - Ansible stdout (visible in terminal)
    #   - CI/CD build logs (visible to anyone with CI access)
    #   - Centralized log aggregation (Splunk, ELK, CloudWatch)
    # PCI-DSS 10.3.4: logs must not contain credentials or cardholder data.
    # Fix: add 'no_log: true' to any task that touches secret values.
    - name: "BAD | Configure Vault token — leaks to logs"
      when: false
      lineinfile:
        path: /etc/vault-agent/config.hcl
        line: "token = {{ vault_token }}"
      # BUG: no no_log: true — vault_token appears in every log aggregator

    # ── Anti-Pattern 4: validate_certs: no ────────────────────────────────
    # BUG: disabling cert validation opens MITM attack vector.
    # An attacker on the same network can intercept payment API responses.
    # PCI-DSS 4.2.1: all PAN transmission must use strong cryptography.
    # "validate_certs: no" defeats the TLS protection entirely.
    # Fix: validate_certs: yes, ca_path: /etc/ssl/certs/tch-internal-ca.crt
    - name: "BAD | Call payment API without cert validation"
      when: false
      uri:
        url: "https://payments-internal.tch.com/api/health"
        # BUG: MITM attack vector — never in production
        validate_certs: no

    # ── Anti-Pattern 5: World-readable config file ─────────────────────────
    # BUG: mode 0644 means any local user can read /etc/app/app.conf.
    # If app.conf contains db_password or api_key, any process on the server can read it.
    # PCI-DSS 7.2: restrict access to system components by need to know.
    # Fix: mode: '0600' (owner only) or '0640' (owner + group, if service account uses group).
    - name: "BAD | Deploy config with world-readable permissions"
      when: false
      template:
        src: app.conf.j2
        dest: /etc/app/app.conf
        # BUG: world-readable — any user on the server sees db passwords
        mode: "0644"
