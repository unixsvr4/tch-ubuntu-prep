---
# ============================================================
# SECRETS — GOOD EXAMPLES (Day 2.3 Correct Patterns)
# ============================================================
# These are the correct versions of every anti-pattern in secrets-bad.yml.
# This playbook CAN run against the practice container.
#
# Run: cd ansible && ansible-playbook -i inventory/docker-hosts playbooks/secrets-good.yml -v
# ============================================================

- name: "GOOD EXAMPLES — Secure secrets handling for payment servers"
  hosts: payment_servers
  become: true

  vars_files:
    # ansible-vault encrypted in production. For this demo: plain example file.
    # Run with: --vault-password-file .vault_pass when using real encrypted vars.
    - ../group_vars/prod/vault_example.yml

  pre_tasks:
    - name: "prereq | Install python3-psycopg2 (required by postgresql_user module)"
      apt:
        name: python3-psycopg2
        state: present
        update_cache: true

  tasks:

    # ── Fix 1: Vault-encrypted variable, no_log: true ─────────────────────
    # vault_db_password comes from group_vars/prod/vault.yml (encrypted).
    # no_log: true prevents the password appearing in logs, stdout, or CI output.
    # PCI-DSS 10.3.4: logs must not contain credentials.
    - name: "GOOD | Create PostgreSQL user with ansible-vault encrypted password"
      # login_host: connects to the tch-postgres container over the Docker network.
      # In production: login_host points to your RDS/Cloud SQL endpoint.
      community.postgresql.postgresql_user:
        login_host: tch-postgres
        login_user: vault_admin
        login_password: vault_admin_pass
        login_port: 5432
        user: payments_app
        password: "{{ vault_db_password }}"
        login_db: payments
      # GOOD: prevents password appearing in any log output
      no_log: true

    # ── Fix 2: Non-root service account ───────────────────────────────────
    # GOOD: become_user = deploy (non-root with specific sudo rules).
    # If compromised, attacker has deploy-user privileges — not root.
    # PCI-DSS 8.2.1: each individual/service has a unique, least-privilege account.
    - name: "GOOD | Deploy app as non-root service account"
      copy:
        src: /dev/null      # placeholder — no real jar in demo
        dest: /tmp/app-deployed-as-deploy-user
        mode: "0640"
        owner: payments
        group: payments
      # GOOD: dedicated service account, not root
      become_user: payments
      ignore_errors: true

    # ── Fix 3: no_log on all sensitive tasks ──────────────────────────────
    # Vault token configuration: no_log prevents the token value reaching any log.
    # Combined with: restrict config file permissions to root only (mode 0600).
    - name: "GOOD | Create vault-agent config directory"
      file:
        path: /etc/vault-agent
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: "GOOD | Configure Vault token — no_log suppresses secret from all logs"
      lineinfile:
        path: /etc/vault-agent/config.hcl
        line: "token = {{ vault_vault_token }}"
        create: true
        # Only root can read the Vault config
        mode: "0600"
        owner: root
        group: root
      # GOOD: token value never appears in stdout, CI logs, or Splunk
      no_log: true

    # ── Fix 4: validate_certs: yes with custom CA ─────────────────────────
    # Internal services use a self-signed CA — provide the CA cert path.
    # Disabling cert validation defeats the purpose of TLS entirely.
    # PCI-DSS 4.2.1: strong cryptography for PAN in transit.
    - name: "GOOD | Call payment API with cert validation (pattern demo)"
      # In production: validate_certs: yes + ca_path: /etc/ssl/certs/tch-internal-ca.crt
      # This container has no HTTP server so the request will fail — that is expected.
      # The point is the CODE PATTERN: always set validate_certs: yes in real playbooks.
      uri:
        url: "https://localhost/health"
        validate_certs: false
      failed_when: false

    # ── Fix 5: Strict file permissions on config with secrets ─────────────
    # mode 0600: only the file owner can read/write.
    # mode 0640: owner read/write + group read (use when service runs as different UID).
    # PCI-DSS 7.2: restrict access by need to know.
    - name: "GOOD | Deploy app config with owner-only permissions"
      copy:
        content: |
          # payments app config — deployed by Ansible
          # Actual secrets injected by Vault agent at runtime
          db_host = "payments-db.internal"
          db_port = 5432
          db_name = "payments"
          # db_user and db_password come from Vault dynamic credentials — NOT this file
        dest: /etc/payments/app.conf
        owner: payments
        group: payments
        # GOOD: only the payments user can read their own config
        mode: "0600"
      # Config itself has no secrets (Vault provides creds at runtime)
      no_log: false
      ignore_errors: true

    # ── Demonstrate: ansible-vault encrypt_string output ─────────────────
    # This task shows how to verify that the vault variable IS encrypted
    # (the raw variable will be an AES-256 ciphertext blob in production).
    - name: "INFO | Show vault_db_password is available (without exposing value)"
      debug:
        msg: "vault_db_password is set ({{ vault_db_password | length }} chars)"
        # no_log NOT set here — we're only showing the length, not the value
        # This is a safe way to verify a secret was loaded without exposing it
