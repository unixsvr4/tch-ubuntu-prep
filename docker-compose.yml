---
# tch-ubuntu-prep docker-compose — all services for local practice (Ubuntu 24.04)
# Requires Docker Engine CE. All images have native linux/amd64 support.
#
# Start:  make up
# Stop:   make down
# Logs:   docker compose logs -f <service>

services:

  # ─── HashiCorp Vault (dev mode) ─────────────────────────────────────────────
  # Dev mode: auto-unsealed, root token = "root", in-memory only (no disk persistence)
  # UI:       http://localhost:8200   Login: Token / root
  # CLI:      VAULT_ADDR=http://localhost:8200 VAULT_TOKEN=root vault status
  #
  # NEVER use -dev in production. Dev mode stores no data across restarts and
  # accepts any root token — it exists solely for local experimentation.
  vault:
    image: hashicorp/vault:1.16
    container_name: tch-ubuntu-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root                  # root token for local practice
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: warn
    cap_add:
      - IPC_LOCK   # Vault locks memory to prevent secrets from being swapped to disk
    command: vault server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - tch-net

  # ─── PostgreSQL — target for Vault dynamic credentials ──────────────────────
  # Vault connects as vault_admin and creates/revokes short-lived app users.
  # This demonstrates PCI-DSS 8.2.2 (no shared accounts) + 8.3.9 (rotation).
  #
  # Direct connect: psql -h localhost -p 5432 -U vault_admin -d payments
  # Password: vault_admin_pass  (from .env.example — local dev only)
  postgres:
    image: postgres:16-alpine
    container_name: tch-ubuntu-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: vault_admin
      POSTGRES_PASSWORD: vault_admin_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script: grants vault_admin CREATEROLE so it can manage dynamic users
      - ./vault/postgres-init.sql:/docker-entrypoint-initdb.d/01-vault-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_admin -d payments"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - tch-net

  # ─── LocalStack — AWS-compatible API for terraform apply practice ────────────
  # Emulates: S3, KMS, IAM, DynamoDB, SecretsManager — all services used in
  # the good Terraform examples. No AWS account or real credentials required.
  #
  # Health: curl http://localhost:4566/_localstack/health
  # S3:     aws --endpoint-url=http://localhost:4566 s3 ls
  localstack:
    image: localstack/localstack:3.4
    container_name: tch-ubuntu-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,kms,iam,dynamodb,secretsmanager
      DEBUG: 0
      # Persist data across restarts so terraform state survives a compose restart
      PERSISTENCE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - tch-net

  # ─── Ubuntu target for Ansible hardening playbook ───────────────────────────
  # Runs sshd on port 2222 (host) → 22 (container).
  # Ansible connects with the demo key generated by `make setup`.
  # Includes: python3, auditd, sshd — all needed for the hardening playbook.
  #
  # Manual SSH: ssh -i ansible/demo_key -p 2222 root@localhost
  # Check: ansible all -m ping (from ansible/ directory)
  ansible-target:
    build:
      context: ./docker/ansible-target
      dockerfile: Dockerfile
    container_name: tch-ubuntu-ansible-target
    ports:
      - "2222:22"
    networks:
      - tch-net

networks:
  tch-net:
    driver: bridge
    name: tch-ubuntu-practice-network

volumes:
  postgres_data:
    name: tch-ubuntu-postgres-data
  localstack_data:
    name: tch-ubuntu-localstack-data
